name: omr-preicfes
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok ? quit(0) : quit(1)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [omr]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [omr]
  backend:
    profiles: ["app"]
    build:
      context: ./apps/backend
    env_file: .env
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD_URLENCODED:?definir MONGO_ROOT_PASSWORD_URLENCODED en .env}@mongo:27017/${MONGO_DB}?authSource=admin
      REDIS_URL: redis://redis:6379/0
      # SOLO desarrollo local con Docker (HT-AUTH-01 DEC-05): el backend en contenedor envía a Mailpit
      # del perfil `mail-dev` por la red `omr` (`localhost` sería el propio contenedor). Levantar ambos
      # perfiles: docker compose --profile app --profile mail-dev up -d. Mailpit nunca es el proveedor de
      # producción: con NODE_ENV=production el arranque falla con SMTP_HOST=mailpit (validación de T-11).
      SMTP_HOST: mailpit
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [omr]
  omr:
    profiles: ["app"]
    build:
      context: ./apps/omr
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["127.0.0.1:8000:8000"]
    networks: [omr]
  frontend:
    profiles: ["app"]
    build:
      context: ./apps/frontend
    # Sin env_file: `.env` contiene secretos y este servicio solo necesita estas dos variables (HT-AUTH-02).
    environment:
      API_PROXY_TARGET: http://backend:3000
      VITE_CAPTCHA_SITE_KEY: ${VITE_CAPTCHA_SITE_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports: ["127.0.0.1:5173:5173"]
    networks: [omr]
  # Captura de correo SOLO para desarrollo y pruebas (HT-AUTH-01 DEC-05). Perfil `mail-dev`:
  # nunca forma parte del perfil `app` ni de un despliegue. Interfaz: http://127.0.0.1:8025
  mailpit:
    profiles: ["mail-dev"]
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks: [omr]
networks:
  omr: {}
volumes:
  mongo_data: {}
  redis_data: {}
